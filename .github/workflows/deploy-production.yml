name: Deploy production

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.PRODUCTION_APP_DIR }}"
            git fetch --tags origin
            git checkout "${{ github.ref_name }}"
            docker compose --env-file .env.production -f compose.yaml -f compose.production.yaml up -d --build --remove-orphans
            docker compose --env-file .env.production -f compose.yaml -f compose.production.yaml ps
            APP_URL="https://${{ secrets.PRODUCTION_DOMAIN }}" ./scripts/smoke-production.sh
