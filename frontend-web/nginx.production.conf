server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  # Never let the SPA fallback turn dotfiles or deployment files into a
  # successful response. These files must not be public, even if one is
  # accidentally copied into the static build directory.
  location ~ /\.(?!well-known)(?:[^/]+)(?:/|$) {
    return 404;
  }

  location ~* (?:^|/)(?:compose(?:\.[^/]+)?\.ya?ml|Dockerfile(?:\.[^/]*)?)$ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri /index.html;
  }
}
